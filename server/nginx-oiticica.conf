# Proxy reverso do dashboard. Instalar com:
#
#   sudo cp server/nginx-oiticica.conf /etc/nginx/sites-available/oiticica
#   sudo ln -sf /etc/nginx/sites-available/oiticica /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Tres ajustes aqui NAO sao opcionais para este projeto:
#
#   1. o bloco de Upgrade/Connection -- sem ele o WebSocket nao sobe, e e por
#      ele que os comandos de PTZ descem para o Raspberry (README 9-quater);
#   2. proxy_read_timeout alto -- o padrao do nginx e 60s e derrubaria a
#      conexao do agente a cada minuto, num ciclo eterno de reconexao;
#   3. client_max_body_size -- o upload do modelo .glb passa fácil de 1 MB,
#      que e o padrao do nginx.
#
# Ao rodar o certbot (README 17-bis), ele COPIA este bloco inteiro para a
# porta 443 -- os tres ajustes vao junto. Confira mesmo assim depois: se o
# WebSocket ou o upload ficarem de fora do bloco 443, e so leva-los para la.

server {
    listen 80;
    # Se a VPS tiver IPv6, acrescente:  listen [::]:80;
    # Numa maquina SEM IPv6 essa linha impede o nginx de subir, com
    # "Address family not supported by protocol" -- por isso ela nao vem
    # ligada por padrao.

    # Troque para o dominio quando existir -- e o certbot acha o bloco POR
    # ESTE NOME. Com "_" ele nao sabe qual bloco e o seu. Ver README 17-bis.
    #   server_name hydroconecta.com.br www.hydroconecta.com.br;
    server_name _;

    # Upload do modelo 3D pela aba Dispositivos.
    client_max_body_size 512M;

    # Sem isto o nginx bufferiza o upload inteiro em disco antes de repassar.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # WebSocket: canal de comandos do agente (/api/edge/ws) e o do
        # dashboard (/ws).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O agente fica com a conexao aberta indefinidamente.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # O stream de video sai em pedacos pequenos; bufferizar so atrasa.
        proxy_buffering off;
    }
}

# ATENCAO: a variavel $connection_upgrade usada acima nao existe por padrao.
# Ela vem de um "map", que so vale na secao http -- nao dentro de "server".
# Crie /etc/nginx/conf.d/websocket.conf com este conteudo (o diretorio
# conf.d ja e incluido pelo nginx.conf padrao do Debian/Ubuntu):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# Sem esse arquivo o "nginx -t" falha com
# 'unknown "connection_upgrade" variable'.
