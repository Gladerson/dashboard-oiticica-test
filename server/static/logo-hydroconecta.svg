<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260"
     role="img" aria-label="HydroConecta - Telemetria e integridade estrutural monitoradas por IA">
  <defs>
    <linearGradient id="hc-gota" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#0d5f78"/>
      <stop offset="0.45" stop-color="#1a8fa8"/>
      <stop offset="1"    stop-color="#15b9c9"/>
    </linearGradient>
    <linearGradient id="hc-brilho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sinal de conectividade, acima da gota -->
  <g fill="none" stroke="#2fc3d6" stroke-linecap="round">
    <path d="M126 44a34 34 0 0 1 34-9"  stroke-width="7"/>
    <path d="M132 62a20 20 0 0 1 20-6"  stroke-width="7"/>
  </g>

  <!-- Gota -->
  <path d="M100 34c0 0 74 84 74 128a74 74 0 0 1-148 0C26 118 100 34 100 34Z"
        fill="url(#hc-gota)"/>
  <path d="M100 34c0 0 74 84 74 128a74 74 0 0 1-148 0C26 118 100 34 100 34Z"
        fill="url(#hc-brilho)"/>
  <!-- Linha d'agua: o mesmo tom, um pouco mais claro, sugerindo nivel -->
  <path d="M27 150a74 74 0 0 0 146 0Z" fill="#ffffff" opacity="0.07"/>

  <!-- Serie temporal dentro da gota: dois pontos medidos e a tendencia -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 152 88 196 143 128"/>
  </g>
  <g fill="#ffffff">
    <circle cx="64"  cy="152" r="8"/>
    <circle cx="88"  cy="196" r="8"/>
    <circle cx="143" cy="128" r="8"/>
  </g>

  <!-- Marca -->
  <text x="228" y="152" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1">
    <tspan fill="var(--marca-forte, #123f5c)">Hydro</tspan><tspan fill="var(--marca-clara, #21b6d8)">conecta</tspan>
  </text>
  <text x="232" y="186" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="19" fill="var(--marca-apoio, #5a748a)">Telemetria e integridade estrutural monitoradas por IA</text>
  <rect x="232" y="200" width="245" height="7" rx="3.5" fill="#21b6d8"/>
</svg>
